[project]
name = "topoflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stabweee", email = "stanleyhsu2008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=16.0.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "pyproj>=3.6.0",
    "requests>=2.31.0",
    "laspy[lazrs]>=2.5.0",
    "statsmodels>=0.14.0",
    "linearmodels>=6.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "causalimpact>=0.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0"
]

[project.scripts]
topoflow = "topoflow:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "NPY",  # NumPy-specific rules
]
ignore = [
    "E501",  # Line too long (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["topoflow"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
